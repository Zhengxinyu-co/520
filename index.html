<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>520 纪念相册</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <nav class="topbar" aria-label="主导航">
        <a class="brand" href="#top" aria-label="520 纪念相册首页">520</a>
        <div class="nav-links">
          <a href="#gallery">照片</a>
          <a href="#memory">纪念</a>
        </div>
      </nav>

      <section class="hero-content" id="top">
        <p class="eyebrow">May 20</p>
        <h1>把喜欢的瞬间，都放在这里。</h1>
        <p class="hero-copy">
          一个只属于我们的相册页面，打开就能看到这些被认真保存下来的照片。
        </p>
        <a class="hero-action" href="#gallery">查看照片</a>
      </section>
    </header>

    <main>
      <section class="intro" id="memory" aria-labelledby="memory-title">
        <div>
          <p class="section-kicker">Memory</p>
          <h2 id="memory-title">520 的小小网页</h2>
        </div>
        <p>
          用简单干净的版式，把桌面 520 文件夹里的照片整理成一个可以直接打开的网站。
        </p>
      </section>

      <section class="gallery-section" id="gallery" aria-labelledby="gallery-title">
        <div class="section-heading">
          <p class="section-kicker">Gallery</p>
          <h2 id="gallery-title">照片墙</h2>
        </div>

        <div class="gallery" aria-label="照片列表">
          <button class="photo-card is-large" type="button" data-photo="assets/photos/photo-01.jpg">
            <img src="assets/photos/photo-01.jpg" alt="520 相册照片 1" />
          </button>
          <button class="photo-card" type="button" data-photo="assets/photos/photo-02.jpg">
            <img src="assets/photos/photo-02.jpg" alt="520 相册照片 2" />
          </button>
          <button class="photo-card" type="button" data-photo="assets/photos/photo-03.jpg">
            <img src="assets/photos/photo-03.jpg" alt="520 相册照片 3" />
          </button>
          <button class="photo-card is-wide" type="button" data-photo="assets/photos/photo-04.jpg">
            <img src="assets/photos/photo-04.jpg" alt="520 相册照片 4" />
          </button>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>520 · 纪念每一个值得被保存的瞬间</p>
    </footer>

    <dialog class="lightbox" aria-label="照片预览">
      <button class="close-button" type="button" aria-label="关闭照片预览">×</button>
      <img src="" alt="放大的相册照片" />
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
